<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SHK Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background: radial-gradient(circle at top right, #FDFCFB 0%, #E2D1C3 100%),
                        radial-gradient(circle at bottom left, #E3F2FD, #BBDEFB);
            background: radial-gradient(circle at 20% 20%, rgba(26, 35, 126, 0.05), transparent),
                        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.1), transparent),
                        linear-gradient(135deg, #FFFFFF 0%, #F5F7FA 100%);
            background-attachment: fixed;
            min-height: screen;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="p-6 relative">
    <!-- Top Left Branding -->
    <div class="absolute top-6 left-8 flex items-center gap-6 z-20">
        <div class="w-24 h-24 transform hover:scale-110 transition-all duration-500">
            <img src="{{ url_for('static', filename='img/shk_logo_new.png') }}" alt="Logo" class="w-full h-full object-contain filter drop-shadow-md">
        </div>
        <h1 class="text-xl font-black text-[#1A237E] tracking-tighter uppercase">
            SHK <span class="text-[#D4AF37]">CONNECT</span>
        </h1>
    </div>

    <div class="glass-card p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.15)] w-full relative z-10" style="max-width: 450px;">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-[#1A237E]">Sign In</h2>
            <p class="text-gray-400 text-sm mt-2 font-medium">Welcome back to SHK Industries</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="bg-rose-50 text-rose-600 p-3 rounded-xl text-sm mb-4 border border-rose-100 text-center">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Email Address</label>
                <input type="email" name="email" class="w-full p-4 border border-gray-200 rounded-xl outline-none focus:border-[#1A237E] focus:ring-1 focus:ring-[#1A237E] transition-all" placeholder="name@shkindustries.com" required>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Password</label>
                <input type="password" name="password" class="w-full p-4 border border-gray-200 rounded-xl outline-none focus:border-[#1A237E] focus:ring-1 focus:ring-[#1A237E] transition-all" placeholder="••••••••" required>
            </div>
            
            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" name="remember" class="w-4 h-4 rounded border-gray-300 text-[#1A237E] focus:ring-[#1A237E]">
                    <span>Remember me</span>
                </label>
                <a href="#" class="text-sm text-[#1A237E] font-semibold hover:underline">Forgot Password?</a>
            </div>

            <button type="submit" class="w-full bg-[#1A237E] text-white p-4 rounded-xl font-bold hover:bg-[#3949AB] transition shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-0.5 active:translate-y-0">
                SIGN IN
            </button>
        </form>

    <br>
        <p class="text-center mt-8 text-gray-500 text-sm">
    span class="text-[#1A237E] font-bold cursor-pointer hover:underline">V 1.0</span>
    
    </div>
</body>
</html>
