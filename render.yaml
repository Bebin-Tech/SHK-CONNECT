services:
  - type: web
    name: shk-connect
    runtime: docker
    healthCheckPath: /api/health
    dockerCommand: sh -c 'alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2 --no-proxy-headers'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shk-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: attachments
      mountPath: /data
      sizeGB: 10
databases:
  - name: shk-connect-db
    databaseName: shk_connect
    user: shk
