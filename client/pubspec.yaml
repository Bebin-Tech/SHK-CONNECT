name: shk_connect
description: Unified SHK workspace for iOS, Android and the Web.
publish_to: none
version: 2.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  file_picker: ^10.3.0
  file_saver: ^0.3.1
  uuid: ^4.5.2
  pdfrx: ^2.4.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/shk_logo_new.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/shk_logo_new.png
    background_color: '#F8FAFD'
    theme_color: '#D2E8FC'
