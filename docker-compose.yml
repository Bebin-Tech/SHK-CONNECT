services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shk
      POSTGRES_DB: shk_connect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shk -d shk_connect"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://shk:${POSTGRES_PASSWORD}@db:5432/shk_connect
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://connect.example.com"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["connect.example.com"]}
      UPLOAD_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *api-environment
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
