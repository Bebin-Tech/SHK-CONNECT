<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHK Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'shk-navy': '#0e1b42',
                        'shk-blue': '#517ea2',
                        'shk-red': '#a61a2e',
                        'shk-gold': '#e1ad21',
                        'shk-light': '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; margin: 0; }
        #root { height: 100vh; width: 100vw; }
    </style>

    {% if frontend_entry %}
    {% for css in frontend_entry.get('css', []) %}
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/' + css) }}">
    {% endfor %}
    <script type="module" src="{{ url_for('static', filename='dist/' + frontend_entry['file']) }}"></script>
    {% else %}
    <script>document.addEventListener('DOMContentLoaded', () => { document.getElementById('root').textContent = 'Frontend build missing. Run npm ci and npm run build in frontend, then reload.'; });</script>
    {% endif %}
</head>
<body class="text-slate-800">
    <div id="root">
        <div class="h-full w-full flex items-center justify-center">
            <div class="animate-pulse flex flex-col items-center gap-4">
                <div class="w-12 h-12 bg-slate-200 rounded-full"></div>
                <p class="text-slate-400 font-medium">Initializing SHK Connect...</p>
            </div>
        </div>
    </div>
</body>
</html>
