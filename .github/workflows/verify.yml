name: Cross-platform verification
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shk_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U shk -d shk_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend --select E9,F63,F7,F82
      - run: python -m pytest backend/tests -q
      - name: Verify PostgreSQL schema and API
        env:
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
          DATABASE_URL: postgresql+psycopg://shk:ci-only-password@localhost:5432/shk_test
        run: |
          alembic upgrade head
          alembic check
          python -m backend.postgres_smoke
          SHK_TEST_DATABASE_URL="$DATABASE_URL" python -m pytest backend/tests -q
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - working-directory: client
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build web --release --no-web-resources-cdn
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Build Android with Java 17
        working-directory: client
        env:
          SHK_APP_ID_SUFFIX: .online
          SHK_APP_LABEL: SHK Connect Online
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter pub get
          flutter build apk --debug --dart-define=API_BASE_URL=https://shk-connect-api-production.up.railway.app/api/v1
      - name: Upload online-testing APK
        uses: actions/upload-artifact@v4
        with:
          name: shk-connect-android-debug
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - working-directory: client
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://connect.example.com/api/v1
