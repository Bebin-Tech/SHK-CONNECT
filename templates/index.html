<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shk Industries Work Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.1); }
        .active-channel { background: rgba(255, 255, 255, 0.1); color: white; }
    </style>
</head>
<body class="bg-[#313338] text-gray-100 h-screen overflow-hidden flex">

    <!-- Workspace Sidebar -->
    <aside class="w-[72px] bg-[#1E1F22] flex flex-col items-center py-3 space-y-4">
        <div class="w-12 h-12 bg-[#5865F2] rounded-2xl flex items-center justify-center cursor-pointer hover:rounded-xl transition-all shadow-lg">
            <i data-lucide="home" class="text-white"></i>
        </div>
        <div class="w-8 h-[2px] bg-zinc-700 rounded-full"></div>
        {% for workspace in workspaces %}
        <div class="w-12 h-12 bg-[#313338] rounded-3xl flex items-center justify-center cursor-pointer hover:rounded-xl hover:bg-[#5865F2] transition-all group relative">
            <span class="text-white font-bold">{{ workspace.name[0] }}</span>
        </div>
        {% endfor %}
        <div class="w-12 h-12 bg-[#313338] rounded-3xl flex items-center justify-center cursor-pointer hover:rounded-xl hover:bg-emerald-500 transition-all">
            <i data-lucide="plus" class="text-emerald-500 hover:text-white"></i>
        </div>
    </aside>

    <!-- Channel Sidebar -->
    <aside class="w-60 bg-[#2B2D31] flex flex-col">
        <header class="h-12 px-4 flex items-center justify-between border-b border-[#1E1F22] hover:bg-zinc-700/50 cursor-pointer">
            <h1 class="font-bold text-sm">Shk Industries</h1>
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
        </header>
        <nav class="flex-1 overflow-y-auto pt-4 px-2 space-y-4">
            <div>
                <div class="text-xs font-semibold text-zinc-400 uppercase px-2 mb-2 flex justify-between items-center">
                    <span>Text Channels</span>
                    <i data-lucide="plus" class="w-3 h-3 cursor-pointer"></i>
                </div>
                <div id="channel-list" class="space-y-[2px]">
                    <div class="flex items-center space-x-2 px-2 py-1.5 rounded active-channel cursor-pointer">
                        <i data-lucide="hash" class="w-4 h-4 text-zinc-400"></i>
                        <span class="text-sm font-medium">general</span>
                    </div>
                </div>
            </div>
        </nav>
        <footer class="bg-[#232428] p-2 flex items-center space-x-2">
            <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center text-xs font-bold text-white">
                {{ current_user.username[0] }}
            </div>
            <div class="flex-1 overflow-hidden">
                <p class="text-xs font-bold truncate">{{ current_user.username }}</p>
                <p class="text-[10px] text-zinc-400 truncate">Online</p>
            </div>
            <div class="flex space-x-1">
                <i data-lucide="mic" class="w-4 h-4 text-zinc-400 cursor-pointer"></i>
                <i data-lucide="settings" class="w-4 h-4 text-zinc-400 cursor-pointer"></i>
            </div>
        </footer>
    </aside>

    <!-- Chat Area -->
    <main class="flex-1 bg-[#313338] flex flex-col">
        <header class="h-12 px-4 flex items-center shadow-sm border-b border-[#1E1F22]">
            <i data-lucide="hash" class="w-6 h-6 text-zinc-400 mr-2"></i>
            <h2 class="font-bold">general</h2>
        </header>

        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Messages go here -->
        </div>

        <div class="px-4 pb-6">
            <div id="typing-indicator" class="text-xs text-zinc-400 h-4 ml-14 mb-1"></div>
            <form id="message-form" class="bg-[#383A40] rounded-lg p-3 flex items-center space-x-4">
                <div class="p-1 bg-zinc-400 rounded-full cursor-pointer hover:bg-white transition-colors">
                    <i data-lucide="plus" class="w-4 h-4 text-[#383A40]"></i>
                </div>
                <input id="message-input" type="text" placeholder="Message #general" class="bg-transparent border-none outline-none flex-1 text-sm text-zinc-200">
                <div class="flex space-x-3 text-zinc-400">
                    <i data-lucide="smile" class="w-5 h-5 cursor-pointer"></i>
                </div>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
