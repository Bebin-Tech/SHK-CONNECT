<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SHK Industries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-[#1A237E] to-[#3949AB] min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full" style="max-width: 450px;">
        <div class="text-center mb-10">
            <div class="w-48 h-48 mx-auto transform hover:scale-105 transition-all duration-500">
                <img src="{{ url_for('static', filename='img/shk_logo.png') }}" alt="SHK Industries" class="w-full h-full object-contain filter drop-shadow-lg" onerror="this.style.display='none'">
            </div>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 rounded-xl text-sm mb-4 border text-center {% if category == 'danger' %}bg-rose-50 text-rose-600 border-rose-100{% else %}bg-blue-50 text-blue-600 border-blue-100{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('signup') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Full Name</label>
                <input type="text" name="username" class="w-full p-4 border border-gray-200 rounded-xl outline-none focus:border-[#1A237E] focus:ring-1 focus:ring-[#1A237E] transition-all" placeholder="John Doe" required>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Work Email</label>
                <input type="email" name="email" class="w-full p-4 border border-gray-200 rounded-xl outline-none focus:border-[#1A237E] focus:ring-1 focus:ring-[#1A237E] transition-all" placeholder="name@shkindustries.com" required>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Secure Password</label>
                <input type="password" name="password" class="w-full p-4 border border-gray-200 rounded-xl outline-none focus:border-[#1A237E] focus:ring-1 focus:ring-[#1A237E] transition-all" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full bg-[#1A237E] text-white p-4 rounded-xl font-bold hover:bg-[#3949AB] transition shadow-lg hover:shadow-indigo-500/30 transform hover:-translate-y-0.5 active:translate-y-0">
                CREATE ACCOUNT
            </button>
        </form>

        <p class="text-center mt-8 text-gray-500 text-sm">
            Already have an account? <a href="{{ url_for('login') }}" class="text-[#1A237E] font-bold hover:underline cursor-pointer">Sign In</a>
        </p>
    </div>
</body>
</html>
